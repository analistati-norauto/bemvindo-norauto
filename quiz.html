<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Integração NORAUTO</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header-interna">
        <div class="logo-header">
            <img src="assets/logo/PNG Logo Norauto.png" alt="NORAUTO" style="height: 40px; width: auto;">
        </div>
        <div class="user-info">
            <span id="nome-motorista">Carregando...</span>
            <button class="btn-sair" onclick="fazerLogout()">Sair</button>
        </div>
    </header>

    <main class="quiz-container">
        <div class="quiz-header">
            <h2 style="color: var(--azul-escuro);">Quiz de Integração</h2>
            <div class="quiz-progress" id="indicador-progresso">Pergunta 1 de 5</div>
        </div>
        
        <div id="area-pergunta">
            <!-- A pergunta e alternativas serão injetadas via JS -->
        </div>

        <div id="mensagem-erro" class="alert alert-error hidden" style="margin-bottom: 20px;">
            Selecione uma alternativa antes de continuar.
        </div>

        <div class="quiz-actions">
            <button class="btn btn-secundario" id="btn-anterior" onclick="perguntaAnterior()" style="display: none;">Anterior</button>
            
            <div style="flex-grow: 1;"></div> <!-- Espaçador flex -->
            
            <button class="btn btn-amarelo" id="btn-proxima" onclick="proximaPergunta()" style="max-width: 200px;">Próxima</button>
            <button class="btn btn-amarelo" id="btn-finalizar" onclick="finalizarQuiz()" style="max-width: 200px; display: none;">Finalizar quiz</button>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/perguntas.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
